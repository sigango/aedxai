evaluation:
  metrics:
    pointing_game:
      enabled: true
    energy_based_pg:
      enabled: true
    over_all:
      enabled: true
      # Perturbation settings for insertion/deletion
      num_steps: 10                    # K = [10%, 20%, ..., 100%]
      baseline_method: "blur"          # Options: "blur", "mean", "black"
      blur_kernel_size: 51             # For blur baseline
      # Detector forwards per batch when scoring perturbation steps. 1 = legacy
      # one-image-at-a-time path; >1 gives the same values faster on GPU.
      batch_size: 1
    # Box-relative insertion/deletion (evaluate_evidence only; not in the composite).
    # Pixels are ranked and perturbed only inside the detection box scaled by
    # context_scale; everything outside stays original, so each step is a fixed
    # fraction of the object's neighbourhood instead of 10% of the whole image.
    over_all_box:
      enabled: true
      num_steps: 10
      context_scale: 2.0
    sparsity:
      enabled: true
      method: "gini"                   # Options: "gini", "max_over_mean" (ODExAI uses max/mean)
    computation_time:
      enabled: true
  
  # Composite score weights (sum must = 1.0)
  # Plausibility uses EBPG (energy-based pointing game) rather than PG: continuous
  # signal, robust to per-object saliency renormalization, and standard in recent
  # XAI-for-detection papers (D-CLOSE, G-CAME).
  composite_weights:
    ebpg: 0.333333    # Plausibility (fraction of saliency energy inside bbox)
    oa: 0.333333      # Faithfulness (insertion_AUC − deletion_AUC, mapped to [0,1])
    sparsity: 0.333333  # Focus (Gini coefficient)
  
  # Feedback loop
  feedback:
    enabled: true
    threshold: 0.5                     # Fallback for threshold_mode: fixed
    threshold_mode: "percentile"       # Options: "fixed", "percentile", "learned"
    threshold_percentile: 40           # Used when threshold_mode = "percentile"
    # threshold_model_path: "data/checkpoints/threshold_model.pkl"  # for learned mode
    max_iterations: 3
    # Adjustment rules
    conf_thresh_step: 0.05             # Increment per iteration
    nms_thresh_step: 0.05              # Decrement per iteration
    # Clamping ranges
    conf_thresh_range: [0.10, 0.70]
    nms_thresh_range: [0.30, 0.70]
    # Early stopping: stop if improvement < this between iterations
    min_improvement: 0.01
    # Method-independent VLM false-positive filtering (skip explaining boxes
    # the VLM flags as false positives). For fair comparison this must be
    # applied to EVERY method's evaluation population, so it defaults to off.
    vlm_fp_filter: false
    # When set (e.g. "gcame"), every detection uses this method and the selector
    # is bypassed. Combine with escalation to run the G-CAME -> backup cascade.
    fixed_method: null
    # Evaluate-then-escalate cascade: when a detection's composite falls below
    # tau, run the backup method and keep the better-scoring map (keep-max never
    # decreases the selection metric for the same detections).
    # Opt-in: enable per run (run_experiments.py --escalation on).
    # tau is calibrated OFFLINE per detector with scripts/calibrate_tau.py on a
    # calibration split disjoint from every test manifest, then frozen here.
    # The values below are PROVISIONAL: p30 of G-CAME composites on the old
    # selector-training rows, which overlap 202 headline test images. Replace
    # them with the calibrate_tau.py output before any reported cascade run.
    escalation:
      enabled: false
      backup_method: "lime"
      tau: 0.6546                      # fallback when a detector has no entry below
      tau_by_detector:
        yolox-s: 0.6546
        fasterrcnn_resnet50_fpn_v2: 0.6922

# Experiment settings
experiments:
  seed: 42
  num_runs: 3                          # Repeat with different seeds for std
  seeds: [42, 123, 456]
  num_images_main: 500                 # Exp 1, 2, 4
  num_images_vlm_ablation: 200         # Exp 3
  num_images_cross_domain: 100         # Exp 5
  save_intermediate: true              # Save per-image results
  log_to_wandb: false                  # Set true if using wandb
